<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" font-family="PingFang SC, Noto Sans CJK SC, Helvetica, Arial, sans-serif">
  <rect width="1200" height="1700" fill="#ffffff"/>
  <text x="600" y="90" text-anchor="middle" font-size="40" font-weight="700" fill="#1c1c1e">五年级随堂练习</text>
  <text x="120" y="150" font-size="24" fill="#5b5b63">姓名：______　　班级：______　　得分：</text>
  <text x="640" y="156" font-size="40" fill="#d12e2e" font-weight="700">82</text>

  <text x="120" y="290" font-size="30" fill="#1c1c1e">1. 一根绳子长 24 米，第一次用去全长的 3/8，第二次用去剩下的 1/3。</text>
  <text x="156" y="336" font-size="30" fill="#1c1c1e">两次共用去多少米？</text>
  <text x="156" y="392" font-size="28" fill="#2b4c9b" font-style="italic">答：24 × 3/8 = 9（米）　9 + 24 × 1/3 = 17（米）</text>
  <path d="M900 350 l30 36 l60 -70" stroke="#d12e2e" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M960 330 l50 60 M1010 330 l-50 60" stroke="#d12e2e" stroke-width="8" fill="none" stroke-linecap="round"/>

  <text x="120" y="540" font-size="30" fill="#1c1c1e">2. 下列句子没有语病的一项是（　　）</text>
  <text x="156" y="590" font-size="28" fill="#1c1c1e">A. 通过这次读书节，使我爱上了阅读。</text>
  <text x="156" y="636" font-size="28" fill="#1c1c1e">B. 我们要养成认真完成作业的好习惯。</text>
  <text x="156" y="682" font-size="28" fill="#1c1c1e">C. 他大约有十二岁左右。</text>
  <text x="156" y="736" font-size="28" fill="#2b4c9b" font-style="italic">学生作答：A</text>
  <path d="M400 700 l50 60 M450 700 l-50 60" stroke="#d12e2e" stroke-width="8" fill="none" stroke-linecap="round"/>

  <text x="120" y="880" font-size="30" fill="#1c1c1e">3. She ___ (visit) her grandparents last weekend.</text>
  <text x="156" y="934" font-size="28" fill="#2b4c9b" font-style="italic">学生作答：visits</text>
  <path d="M480 900 l50 60 M530 900 l-50 60" stroke="#d12e2e" stroke-width="8" fill="none" stroke-linecap="round"/>

  <text x="120" y="1080" font-size="30" fill="#1c1c1e">4. 一个圆的半径是 3 厘米，它的面积是多少？</text>
  <text x="156" y="1134" font-size="28" fill="#2b4c9b" font-style="italic">答：3.14 × 3² = 28.26（平方厘米）</text>
  <path d="M760 1100 l30 36 l60 -70" stroke="#2e9e5b" stroke-width="8" fill="none" stroke-linecap="round"/>

  <text x="120" y="1280" font-size="30" fill="#1c1c1e">5. 用"因为……所以……"造句。</text>
  <text x="156" y="1334" font-size="28" fill="#2b4c9b" font-style="italic">因为今天下雨，所以我们没有去春游。</text>
  <path d="M780 1300 l30 36 l60 -70" stroke="#2e9e5b" stroke-width="8" fill="none" stroke-linecap="round"/>

  <text x="120" y="1500" font-size="26" fill="#5b5b63">订正提醒：注意题目中的"剩下的"和"last weekend"，它们会影响解题方法。</text>
</svg>
