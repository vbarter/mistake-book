[program:zhicuoben]
directory=/opt/zhicuoben/server
command=/opt/zhicuoben/server/.venv/bin/gunicorn --workers 1 --threads 8 --timeout 120 --bind 127.0.0.1:5001 --access-logfile /opt/zhicuoben/data/access.log --error-logfile /opt/zhicuoben/data/error.log run:app
user=root
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/opt/zhicuoben/data/supervisor-stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/opt/zhicuoben/data/supervisor-stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
