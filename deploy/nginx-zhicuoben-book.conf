# 知错本 API：https://book.openmindai.cn/api/... -> 127.0.0.1:5001/api/...（Flask / gunicorn）
# 证书：Let's Encrypt（certbot webroot 方式，自动续期，续期后 reload nginx）
# 旧入口 http://43.129.175.172:8080/zhicuoben/ 仍保留（default.d/zhicuoben.conf），给已安装的旧版 App 用

server {
    listen 80;
    listen [::]:80;
    server_name book.openmindai.cn;

    # 证书续期校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name book.openmindai.cn;

    ssl_certificate     /etc/letsencrypt/live/book.openmindai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.openmindai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_book:10m;
    ssl_session_timeout 10m;

    # 一张试卷照片张数不限、上传和 AI 批改都可能较久
    client_max_body_size 150m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
